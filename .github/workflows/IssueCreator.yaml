
name: Create Issue on Push
on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Create Issue with GitHub CLI
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "New Push Detected" \
            --body "A new commit was pushed to main."

      - name: Create Issue with curl
        run: |
          curl -L --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues" \
            -d '{"title":"Issue from curl","body":"Created automatically after push."}'
